[project]
name = "VibeGarden26"
version = "0.1.0"
description = "Biurowo-ogrodniczy kalendarz z pogodą i fazami księżyca"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.7.0",
    "httpx>=0.27.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
